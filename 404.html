<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — PorpamTech</title>
    <meta name="description" content="A página que procura não foi encontrada. Volte à página principal da PorpamTech.">
    <meta name="robots" content="noindex, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
        }
        .glow-1 {
            width: 400px; height: 400px;
            background: #6366f1;
            top: -150px; left: -100px;
            opacity: 0.12;
        }
        .glow-2 {
            width: 350px; height: 350px;
            background: #8b5cf6;
            bottom: -150px; right: -100px;
            opacity: 0.1;
        }

        .content { position: relative; z-index: 1; max-width: 520px; }

        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        p {
            color: #8b8b9e;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            box-shadow: 0 4px 24px rgba(139,92,246,0.3);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(139,92,246,0.4);
        }

        .btn svg { transition: transform 0.3s ease; }
        .btn:hover svg { transform: translateX(4px); }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="content">
        <div class="error-code">404</div>
        <h1>Página não encontrada</h1>
        <p>A página que procura não existe ou foi movida. Não se preocupe, pode voltar à página principal.</p>
        <a href="https://porpamtech.com/" class="btn">
            Voltar ao Início
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
    </div>
</body>
</html>
